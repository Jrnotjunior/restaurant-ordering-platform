name: Build Hostinger production site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-production-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Reuse the environment where the deployment credentials are configured.
    environment: github-pages
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate production environment
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Missing VITE_SUPABASE_URL secret"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Missing VITE_SUPABASE_ANON_KEY secret"; exit 1; }
          test -n "$VITE_MAPBOX_PUBLIC_TOKEN" || { echo "Missing environment secret: VITE_MAPBOX_PUBLIC_TOKEN. Configure it in the github-pages Actions environment."; exit 1; }
          case "$VITE_MAPBOX_PUBLIC_TOKEN" in pk.*) ;; *) echo "VITE_MAPBOX_PUBLIC_TOKEN must be a browser-safe public token beginning pk."; exit 1 ;; esac
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_PUBLIC_TOKEN: ${{ secrets.VITE_MAPBOX_PUBLIC_TOKEN }}

      - name: Build for Hostinger domain root
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_PUBLIC_TOKEN: ${{ secrets.VITE_MAPBOX_PUBLIC_TOKEN }}
          VITE_RESTAURANT_SLUG: solutions
          VITE_DEPLOY_TARGET: hostinger

      - name: Verify restored storefront has no branch API calls
        run: |
          if grep -R -n -E 'resolve_restaurant_branch_by_domain|restaurant_branch_website_customizations|restaurant_branch_product_settings' dist/assets; then
            echo "Refusing to publish bundle that still calls the rolled-back branch APIs."
            exit 1
          fi

      - name: Publish compiled site to hostinger-deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: hostinger-deploy
          force_orphan: true
          commit_message: "Deploy Hostinger site from ${{ github.sha }}"
