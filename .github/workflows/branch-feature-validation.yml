name: Branch Feature Validation

on:
  push:
    branches:
      - feature/multi-branch-storefront
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: TypeScript and production build
        run: npm run build
      - name: Unit tests
        run: npm test
