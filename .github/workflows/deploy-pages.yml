name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate Supabase build configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Missing GitHub Actions secret: VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Missing GitHub Actions secret: VITE_SUPABASE_ANON_KEY"; exit 1; }
          test -n "$VITE_MAPBOX_PUBLIC_TOKEN" || { echo "Missing GitHub Actions secret: VITE_MAPBOX_PUBLIC_TOKEN. Add it in Settings > Secrets and variables > Actions, then rerun this workflow."; exit 1; }
          case "$VITE_MAPBOX_PUBLIC_TOKEN" in pk.*) ;; *) echo "VITE_MAPBOX_PUBLIC_TOKEN must be a browser-safe public token beginning pk."; exit 1 ;; esac
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_PUBLIC_TOKEN: ${{ secrets.VITE_MAPBOX_PUBLIC_TOKEN }}

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_PUBLIC_TOKEN: ${{ secrets.VITE_MAPBOX_PUBLIC_TOKEN }}
          # GitHub Pages is our temporary test storefront. Production
          # multi-tenant routing will resolve by custom domain/Hostinger.
          VITE_RESTAURANT_SLUG: solutions

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
